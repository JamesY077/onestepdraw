<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="solid" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#C4664A"/>
      <stop offset="0.52" stop-color="#B4553A"/>
      <stop offset="1" stop-color="#8F3C25"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#3A2118" flood-opacity="0.26"/>
