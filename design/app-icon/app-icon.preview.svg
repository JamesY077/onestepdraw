<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAF6"/>
      <stop offset="1" stop-color="#F1EDE3"/>
    </linearGradient>
    <linearGradient id="solid" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#C0603F"/>
      <stop offset="0.5" stop-color="#B4553A"/>
      <stop offset="1" stop-color="#943E27"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#3A2118" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="102" y="102" width="820" height="820" rx="186"/></clipPath>
    <!-- 图标主体，可复用 -->
    <g id="app-icon">
      <g filter="url(#drop)"><rect x="102" y="102" width="820" height="820" rx="186" fill="url(#solid)"/></g>
      <g clip-path="url(#tileClip)">
        <rect x="102" y="102" width="820" height="820" fill="url(#sheen)"/>
        <rect x="103" y="103" width="818" height="818" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
      </g>
      <rect x="272" y="272" width="480" height="480" rx="112" fill="none" stroke="#FCF5EE" stroke-opacity="0.94" stroke-width="38"/>
      <path d="M361 631 H462 V531 H562 V431 H663" fill="none" stroke="#FCF5EE" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- 主图标 -->
  <g transform="translate(88 92) scale(0.56)"><use href="#app-icon"/></g>

  <!-- 文字 -->
  <g font-family="-apple-system, 'SF Pro Display', 'PingFang SC', sans-serif">
    <text x="700" y="188" fill="#1D1D1B" font-size="52" font-weight="650" letter-spacing="-1.4">Stepframe</text>
    <text x="700" y="236" fill="#8C8C84" font-size="19" letter-spacing="2.4">步 帧 · APP ICON</text>

    <text x="700" y="316" fill="#1D1D1B" font-size="22" font-weight="600">一帧 · 一步</text>
    <text x="700" y="352" fill="#66665F" font-size="16">赤陶色底承住一个画框，框里是逐级抬升的台阶。</text>
    <text x="700" y="378" fill="#66665F" font-size="16">frame 是「帧」，staircase 是「步」；抬升的那一端</text>
    <text x="700" y="404" fill="#66665F" font-size="16">表示下一步正在生成。</text>
  </g>

  <!-- 色板 -->
  <g>
    <rect x="700" y="444" width="46" height="46" rx="12" fill="#B4553A"/>
    <text x="758" y="474" fill="#66665F" font-size="14" font-family="'SF Mono', ui-monospace, monospace">#B4553A  赤陶</text>
    <rect x="882" y="444" width="46" height="46" rx="12" fill="#FCF5EE"/>
    <rect x="882.5" y="444.5" width="45" height="45" rx="11.5" fill="none" stroke="#E2DCD0"/>
    <text x="940" y="474" fill="#66665F" font-size="14" font-family="'SF Mono', ui-monospace, monospace">#FCF5EE  奶油</text>
    <rect x="1064" y="444" width="46" height="46" rx="12" fill="#943E27"/>
    <text x="1122" y="474" fill="#66665F" font-size="14" font-family="'SF Mono', ui-monospace, monospace">#943E27</text>
  </g>

  <!-- 缩小后的样子 -->
  <g font-family="-apple-system, 'SF Pro Text', 'PingFang SC', sans-serif">
    <text x="88" y="642" fill="#8C8C84" font-size="14" letter-spacing="1.2">SMALL SIZES</text>
    <g transform="translate(88 660) scale(0.09375)"><use href="#app-icon"/></g>
    <g transform="translate(196 672) scale(0.0547)"><use href="#app-icon"/></g>
    <g transform="translate(272 684) scale(0.03125)"><use href="#app-icon"/></g>
    <text x="320" y="700" fill="#8C8C84" font-size="13">96 / 56 / 32 px</text>
  </g>
</svg>
