<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="Stepframe" />
    <meta name="apple-mobile-web-app-title" content="Stepframe" />
    <meta
      name="description"
      content="Stepframe（步帧）是一个运行在本地的 AI 创作助手：一句话生成图片与视频，在剪辑台里完成成片。"
    />
    <title>Stepframe 步帧 · 本地 AI 创作助手</title>
    <script>
      // Electron 里给 <html> 打标记，桌面端的窗口适配样式只在 App 内生效。
      ;(function () {
        var ua = navigator.userAgent || ''
        if (!/Electron\//.test(ua)) return
        document.documentElement.classList.add('is-desktop-app')
        if (/Mac OS X/.test(ua)) document.documentElement.classList.add('mac-app')
        else document.documentElement.classList.add('win-app')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
